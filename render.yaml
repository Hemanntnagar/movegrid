# Render Blueprint — API lives in backend/
#
# Dashboard: New → Blueprint → connect this repo (uses this file at repo root).
# Or on an existing web service: Root Directory = backend, then match build/start below.
#
# After deploy, set CORS_ORIGINS to your Vercel production URL, e.g.:
# ["https://movegrid-one.vercel.app","http://localhost:3000"]

databases:
  - name: movegrid-db
    plan: free
    databaseName: movegrid
    user: movegrid

services:
  - type: web
    name: movegrid-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DATABASE_URL
        fromDatabase:
          name: movegrid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'
      # Optional: set GEMINI_API_KEY in the Render dashboard for AI-generated fitness plans.
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: GEMINI_MODEL
      #   value: gemini-3.8-flash
